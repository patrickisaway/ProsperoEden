name: Theme preview

# Draws every launcher screen in one theme on the runner (tools/launcher/preview.sh: Mesa's
# software renderer, the same code, shaders and font as on the console) and keeps the pictures
# as an artifact. A few minutes, without building the emulator.
on:
  # Also at every push to the theme's branch.
  push:
    branches: [switch-theme]
  workflow_dispatch:
    inputs:
      theme:
        description: "Theme id (docs/THEMES.md)"
        default: switch

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install OpenGL and EGL (Mesa)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl-dev libgl-dev mesa-common-dev \
            libegl-mesa0 libgl1-mesa-dri

      - name: Draw the screens
        env:
          PE_THEME: ${{ inputs.theme }}
        run: bash tools/launcher/preview.sh "$RUNNER_TEMP/preview"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-${{ inputs.theme }}
          path: ${{ runner.temp }}/preview
          if-no-files-found: error
          retention-days: 7
